name: Android build and release
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: pocket-hud-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish test APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-build-${{ github.run_number }}
          name: Pocket HUD 0.1.0 (build ${{ github.run_number }})
          body: |
            Automated debug build of Pocket HUD.

            This is an early test build. Install only for testing; the runtime estimate is experimental.
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
